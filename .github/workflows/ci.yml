name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: Go Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Verify Go Formatting
        run: |
          cd server
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w server/"
            exit 1
          fi

      - name: Vet
        run: |
          cd server
          go vet ./...

      - name: Run Go Unit Tests
        run: |
          cd server
          go test -v -race -cover ./...

  vulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server
          govulncheck ./...

  test-client:
    name: Client SDK Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: packages/vconsole-remote/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd packages/vconsole-remote
          npm ci

      - name: Build Client SDK
        run: |
          cd packages/vconsole-remote
          npm run build

      - name: Run Client Unit Tests
        run: |
          cd packages/vconsole-remote
          npm test

  test-e2e:
    name: 4-Tier E2E Verification
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Go Server Binary
        run: |
          cd server
          go build -o vconsole-remote .

      - name: Execute 4-Tier Test Suite
        run: |
          node test/run-all.js

  docker:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vconsole-remote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test The Image
        run: |
          docker run -d --name vcr -p 8080:8080 vconsole-remote:ci
          healthy=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/healthz > /dev/null; then
              echo "Server is healthy:"
              curl -s http://127.0.0.1:8080/healthz
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then
            echo "Server did not become healthy in time. Logs:"
            docker logs vcr
            docker rm -f vcr
            exit 1
          fi

          # The image must carry the client SDK, or every page loading
          # /sdk.js from this broker breaks. The route answers 503 with valid
          # JavaScript when the bundle is missing, so assert on the status.
          echo "Checking /sdk.js is embedded and served:"
          code=$(curl -s -o sdk.js -w '%{http_code}' http://127.0.0.1:8080/sdk.js)
          size=$(wc -c < sdk.js)
          echo "  status=$code size=$size"
          if [ "$code" != "200" ] || [ "$size" -lt 100000 ]; then
            echo "/sdk.js did not serve the bundle (status=$code size=$size)"
            head -c 300 sdk.js
            docker rm -f vcr
            exit 1
          fi
          if ! grep -q 'VConsoleRemote' sdk.js; then
            echo "/sdk.js does not expose the VConsoleRemote global"
            docker rm -f vcr
            exit 1
          fi
          node --check sdk.js && echo "  bundle parses as valid JavaScript"

          docker rm -f vcr
