                                                                    Tap the green vConsole floating button and switch to the <b>Remote</b> tab.
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
                                                            <div style={{
                                                                width: 24, height: 24, borderRadius: 12,
                                                                background: token.colorPrimary,
                                                                color: palette.onPrimary,
                                                                fontSize: 12, fontWeight: 'bold',
                                                                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0
                                                            }}>3</div>
                                                            <div>
                                                                <Text strong style={{ fontSize: 13, color: token.colorText }}>Enter PIN or Scan QR</Text>
                                                                <div style={{ fontSize: 12, color: token.colorTextSecondary }}>
                                                                    Enter the 6-digit PIN here or scan the on-device QR code.
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </Card>
                                        </Col>
                                    </Row>
                                </div>
                            </div>
                        ) : (
                            /* Connected DevTools Panel (CardTheme: borderRadius 16, border 1px, elevation 0) */
                            <div style={{
                                flex: 1,
                                display: 'flex',
                                flexDirection: 'column',
                                overflow: 'hidden',
                                background: token.colorBgContainer,
                                borderRadius: 12,
                                border: `1px solid ${token.colorBorder}`,
                                padding: isMobile ? '10px 12px' : '16px 20px'
                            }}>
                                <Tabs
                                    activeKey={activeTab}
                                    onChange={(key) => {
                                        setActiveTab(key);
                                        window.location.hash = `#/room/${roomPin}/${key}`;
                                    }}
                                    size={isMobile ? 'small' : 'middle'}
                                    tabBarGutter={isMobile ? 12 : 24}
                                    more={{ trigger: 'click' }}
                                    style={{ height: '100%', display: 'flex', flexDirection: 'column' }}
                                    items={[
                                        {
                                            key: 'console',
                                            label: (
                                                <span>
                                                    <CodeOutlined style={{ marginRight: 6 }} />
                                                    Console
                                                    <Badge count={logs.length} overflowCount={999} style={{ marginLeft: 8, backgroundColor: token.colorBgLayout, color: token.colorTextSecondary }} />
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                                                    {/* Toolbar */}
                                                    <div style={{
                                                        display: 'flex',
                                                        flexWrap: 'wrap',
                                                        alignItems: 'center',
                                                        justifyContent: 'space-between',
                                                        paddingBottom: 12,
                                                        gap: 10,
                                                        borderBottom: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        <Space wrap>
                                                            <Segmented
                                                                size={isMobile ? 'small' : 'middle'}
                                                                options={[
                                                                    { label: 'All', value: 'all' },
                                                                    { label: 'Log', value: 'log' },
                                                                    { label: 'Info', value: 'info' },
                                                                    { label: 'Warn', value: 'warn' },
                                                                    { label: 'Error', value: 'error' },
                                                                    { label: 'Debug', value: 'debug' },
                                                                ]}
                                                                value={logLevelFilter}
                                                                onChange={setLogLevelFilter}
                                                            />
                                                            <Input
                                                                prefix={<SearchOutlined />}
                                                                placeholder="Filter logs..."
                                                                allowClear
                                                                value={logSearchQuery}
                                                                onChange={(e) => setLogSearchQuery(e.target.value)}
                                                                style={{ width: isMobile ? '100%' : 220, height: 38 }}
                                                            />
                                                        </Space>

                                                        <Button icon={<ClearOutlined />} onClick={() => setLogs([])} style={{ height: 38 }}>
                                                            Clear Logs
                                                        </Button>
                                                    </div>

                                                    {/* Logs Stream List */}
                                                    <div style={{
                                                        flex: 1,
                                                        overflowY: 'auto',
                                                        padding: '12px 0',
                                                        fontFamily: 'var(--font-family-mono)'
                                                    }}>
                                                        {filteredLogs.length === 0 ? (
                                                            <Empty description="No console logs received." style={{ marginTop: 60 }} />
                                                        ) : (
                                                            filteredLogs.map(log => {
                                                                let tagColor = 'default';
                                                                let bg = 'transparent';
                                                                if (log.level === 'warn') {
                                                                    tagColor = 'warning';
                                                                    bg = isDarkMode ? 'rgba(208, 168, 92, 0.10)' : 'rgba(176, 136, 56, 0.10)';
                                                                } else if (log.level === 'error') {
                                                                    tagColor = 'error';
                                                                    bg = isDarkMode ? 'rgba(217, 112, 90, 0.12)' : 'rgba(179, 73, 47, 0.10)';
                                                                } else if (log.level === 'info') {
                                                                    tagColor = 'processing';
                                                                } else if (log.level === 'debug') {
                                                                    tagColor = 'default';
                                                                    bg = 'transparent';
                                                                }

                                                                return (
                                                                    <div
                                                                        key={log.id}
                                                                        style={{
                                                                            display: 'flex',
                                                                            alignItems: 'flex-start',
                                                                            gap: 12,
                                                                            padding: '6px 12px',
                                                                            borderRadius: 8,
                                                                            background: bg,
                                                                            borderBottom: `1px solid ${token.colorBorderSecondary}`,
                                                                            fontSize: 12.5
                                                                        }}
                                                                    >
                                                                        <span style={{ color: token.colorTextTertiary, fontSize: 11, flexShrink: 0 }}>
                                                                            {formatTimestamp(log.timestamp)}
                                                                        </span>
                                                                        <Tag color={tagColor} style={{ textTransform: 'uppercase', fontSize: 10, margin: 0, borderRadius: 4, fontWeight: 600 }}>
                                                                            {log.level}
                                                                        </Tag>
                                                                        <div className="mono-text" style={{ flex: 1, color: token.colorText }}>
                                                                            {log.args.map((arg, idx) => (
                                                                                <span key={idx} style={{ marginRight: 8 }}>
                                                                                    {typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)}
                                                                                </span>
                                                                            ))}
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })
                                                        )}
                                                        <div ref={logsEndRef} />
                                                    </div>
                                                </div>
                                            )
                                        },
                                        {
                                            key: 'network',
                                            label: (
                                                <span>
                                                    <ApiOutlined style={{ marginRight: 6 }} />
                                                    Network
                                                    <Badge count={networkRequests.length} overflowCount={999} style={{ marginLeft: 8, backgroundColor: token.colorBgLayout, color: token.colorTextSecondary }} />
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                                                    <div style={{
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'space-between',
                                                        paddingBottom: 12,
                                                        borderBottom: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        <Input
                                                            prefix={<SearchOutlined />}
                                                            placeholder="Filter by URL or Method..."
                                                            allowClear
                                                            value={networkSearchQuery}
                                                            onChange={(e) => setNetworkSearchQuery(e.target.value)}
                                                            style={{ maxWidth: 300, height: 38 }}
                                                        />
                                                        <Button icon={<ClearOutlined />} onClick={() => setNetworkRequests([])} style={{ height: 38 }}>
                                                            Clear Requests
                                                        </Button>
                                                    </div>

                                                    <div style={{ flex: 1, overflowY: 'auto', marginTop: 12 }}>
                                                        <Table
                                                            size="small"
                                                            pagination={false}
                                                            dataSource={filteredRequests}
                                                            rowKey="id"
                                                            scroll={{ x: 'max-content' }}
                                                            onRow={(record) => ({
                                                                onClick: () => setSelectedRequest(record),
                                                                style: { cursor: 'pointer' }
                                                            })}
                                                            columns={[
                                                                {
                                                                    title: 'Method',
                                                                    dataIndex: 'method',
                                                                    key: 'method',
                                                                    width: 90,
                                                                    render: (method) => (
                                                                        <Tag color={method === 'POST' ? 'success' : method === 'GET' ? 'processing' : 'warning'} style={{ fontWeight: 600, margin: 0 }}>
                                                                            {method}
                                                                        </Tag>
                                                                    )
                                                                },
                                                                {
                                                                    title: 'Status',
                                                                    dataIndex: 'status',
                                                                    key: 'status',
                                                                    width: 80,
                                                                    render: (status) => (
                                                                        <Tag color={status >= 200 && status < 300 ? 'success' : status >= 400 ? 'error' : 'default'} style={{ fontWeight: 600 }}>
                                                                            {status || '---'}
                                                                        </Tag>
                                                                    )
                                                                },
                                                                {
                                                                    title: 'URL',
                                                                    dataIndex: 'url',
                                                                    key: 'url',
                                                                    width: 260,
                                                                    ellipsis: true,
                                                                    render: (url) => <Text style={{ fontFamily: 'var(--font-family-mono)', fontSize: 12, color: token.colorText }}>{url}</Text>
                                                                },
                                                                {
                                                                    title: 'Duration',
                                                                    dataIndex: 'duration',
                                                                    key: 'duration',
                                                                    width: 100,
                                                                    render: (dur) => `${dur || 0} ms`
                                                                },
                                                                {
                                                                    title: 'Time',
                                                                    dataIndex: 'timestamp',
                                                                    key: 'timestamp',
                                                                    width: 110,
                                                                    render: (ts) => formatTimestamp(ts)
                                                                }
                                                            ]}
                                                        />
                                                    </div>

                                                    {/* Request Details Drawer */}
                                                    <Drawer
                                                        title={selectedRequest ? `${selectedRequest.method} ${selectedRequest.url}` : 'Request Details'}
                                                        placement={isMobile ? 'bottom' : 'right'}
                                                        width={isCompact ? '100%' : 560}
                                                        height={isMobile ? '85%' : undefined}
                                                        onClose={() => setSelectedRequest(null)}
                                                        open={!!selectedRequest}
                                                    >
                                                        {selectedRequest && (
                                                            <Tabs
                                                                items={[
                                                                    {
                                                                        key: 'headers',
                                                                        label: 'Headers',
                                                                        children: (
                                                                            <pre style={{
                                                                                fontFamily: 'var(--font-family-mono)',
                                                                                fontSize: 12,
                                                                                padding: 12,
                                                                                borderRadius: 8,
                                                                                background: token.colorBgLayout,
                                                                                border: `1px solid ${token.colorBorder}`,
                                                                                color: token.colorText,
                                                                                overflowX: 'auto'
                                                                            }}>
                                                                                {JSON.stringify(selectedRequest.headers, null, 2)}
                                                                            </pre>
                                                                        )
                                                                    },
                                                                    {
                                                                        key: 'response',
                                                                        label: 'Response Body',
                                                                        children: (
                                                                            <div>
                                                                                {networkBodyMap[selectedRequest.id] ? (
                                                                                    <pre style={{
                                                                                        fontFamily: 'var(--font-family-mono)',
                                                                                        fontSize: 12,
                                                                                        padding: 12,
                                                                                        borderRadius: 8,
                                                                                        background: token.colorBgLayout,
                                                                                        border: `1px solid ${token.colorBorder}`,
                                                                                        color: token.colorText,
                                                                                        overflowX: 'auto',
                                                                                        maxHeight: 400
                                                                                    }}>
                                                                                        {typeof networkBodyMap[selectedRequest.id] === 'string'
                                                                                            ? networkBodyMap[selectedRequest.id]
                                                                                            : JSON.stringify(networkBodyMap[selectedRequest.id], null, 2)}
                                                                                    </pre>
                                                                                ) : (
                                                                                    <div style={{ textAlign: 'center', padding: '36px 0' }}>
                                                                                        <p style={{ color: token.colorTextSecondary, marginBottom: 16 }}>
                                                                                            Large response bodies are cached on the mobile device to save network bandwidth.
                                                                                        </p>
                                                                                        <Button
                                                                                            type="primary"
                                                                                            icon={<ThunderboltOutlined />}
                                                                                            loading={fetchingNetworkBody}
                                                                                            onClick={() => requestPullNetworkBody(selectedRequest.id)}
                                                                                        >
                                                                                            Pull Response Body On-Demand
                                                                                        </Button>
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                        )
                                                                    }
                                                                ]}
                                                            />
                                                        )}
                                                    </Drawer>
                                                </div>
                                            )
                                        },
                                        {
                                            key: 'storage',
                                            label: (
                                                <span>
                                                    <DatabaseOutlined style={{ marginRight: 6 }} />
                                                    Storage
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                                                    <div style={{
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'space-between',
                                                        paddingBottom: 12,
                                                        borderBottom: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        <Space wrap>
                                                            <Segmented
                                                                size={isMobile ? 'small' : 'middle'}
                                                                options={[
                                                                    { label: isMobile ? 'Local' : 'localStorage', value: 'localStorage' },
                                                                    { label: isMobile ? 'Session' : 'sessionStorage', value: 'sessionStorage' },
                                                                    { label: 'Cookies', value: 'cookies' },
                                                                ]}
                                                                value={selectedStorageType}
                                                                onChange={setSelectedStorageType}
                                                            />
                                                            <Input
                                                                prefix={<SearchOutlined />}
                                                                placeholder="Search key or value..."
                                                                value={storageSearchQuery}
                                                                onChange={(e) => setStorageSearchQuery(e.target.value)}
                                                                allowClear
                                                                style={{ width: isMobile ? '100%' : 220, height: 38 }}
                                                            />
                                                        </Space>

                                                        <Button
                                                            type="primary"
                                                            icon={<ReloadOutlined />}
                                                            loading={fetchingStorage}
                                                            onClick={requestPullStorage}
                                                            style={{ height: 38 }}
                                                        >
                                                            Pull Storage
                                                        </Button>
                                                    </div>

                                                    <div style={{ flex: 1, overflowY: 'auto', marginTop: 12 }}>
                                                        <Table
                                                            size="small"
                                                            pagination={false}
                                                            dataSource={storageItems}
                                                            scroll={{ x: 'max-content' }}
                                                            columns={[
                                                                {
                                                                    title: 'Key',
                                                                    dataIndex: 'key',
                                                                    key: 'key',
                                                                    width: isMobile ? 140 : '35%',
                                                                    render: (k) => <Text strong style={{ fontFamily: 'var(--font-family-mono)', color: token.colorText }}>{k}</Text>
                                                                },
                                                                {
                                                                    title: 'Value',
                                                                    dataIndex: 'value',
                                                                    key: 'value',
                                                                    width: isMobile ? 220 : undefined,
                                                                    ellipsis: true,
                                                                    render: (v) => <Text style={{ fontFamily: 'var(--font-family-mono)', color: token.colorTextSecondary }}>{v}</Text>
                                                                },
                                                                {
                                                                    title: 'Action',
                                                                    key: 'actions',
                                                                    width: 80,
                                                                    render: (_, record) => (
                                                                        <Tooltip title="Copy value">
                                                                            <Button
                                                                                type="text"
                                                                                size="small"
                                                                                icon={<CopyOutlined />}
                                                                                onClick={() => {
                                                                                    navigator.clipboard.writeText(record.value);
                                                                                    antMessage.success('Value copied to clipboard!');
                                                                                }}
                                                                            />
                                                                        </Tooltip>
                                                                    )
                                                                }
                                                            ]}
                                                        />
                                                    </div>
                                                </div>
                                            )
                                        },
                                        {
                                            key: 'dom',
                                            label: (
                                                <span>
                                                    <BranchesOutlined style={{ marginRight: 6 }} />
                                                    DOM Inspector
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                                                    <div style={{
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'space-between',
                                                        paddingBottom: 12,
                                                        borderBottom: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        <Text style={{ color: token.colorTextSecondary }}>
                                                            Inspect live DOM hierarchy on the mobile device.
                                                        </Text>
                                                        <Button
                                                            type="primary"
                                                            icon={<ReloadOutlined />}
                                                            loading={fetchingDomTree}
                                                            onClick={requestPullDomTree}
                                                            style={{ height: 38 }}
                                                        >
                                                            Pull DOM Tree
                                                        </Button>
                                                    </div>

                                                    <div style={{
                                                        flex: 1,
                                                        overflowY: 'auto',
                                                        marginTop: 12,
                                                        padding: 14,
                                                        borderRadius: 12,
                                                        background: token.colorBgLayout,
                                                        border: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        {domTree ? (
                                                            <DomTreeNode node={domTree} />
                                                        ) : (
                                                            <div style={{ textAlign: 'center', padding: '60px 0' }}>
                                                                <Empty description="No DOM snapshot captured yet. Click 'Pull DOM Tree' above." />
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        },
                                        {
                                            key: 'screenshot',
                                            label: (
                                                <span>
                                                    <CameraOutlined style={{ marginRight: 6 }} />
                                                    Screen Snapshot
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                                                    <div style={{
                                                        width: '100%',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'space-between',
                                                        paddingBottom: 12,
                                                        borderBottom: `1px solid ${token.colorBorder}`
                                                    }}>
                                                        <Text style={{ color: token.colorTextSecondary }}>
                                                            {screenshotTimestamp ? `Captured at: ${screenshotTimestamp}` : 'Capture a visual snapshot of the device screen.'}
                                                        </Text>
                                                        <Space>
                                                            {screenshotUrl && (
                                                                <Button
                                                                    icon={<DownloadOutlined />}
                                                                    onClick={() => {
                                                                        const a = document.createElement('a');
                                                                        a.href = screenshotUrl;
                                                                        a.download = `vconsole-screenshot-${Date.now()}.png`;
                                                                        a.click();
                                                                    }}
                                                                    style={{ height: 38 }}
                                                                >
                                                                    Download
                                                                </Button>
                                                            )}
                                                            <Button
                                                                type="primary"
                                                                icon={<CameraOutlined />}
                                                                loading={fetchingScreenshot}
                                                                onClick={requestPullScreenshot}
                                                                style={{ height: 38 }}
                                                            >
                                                                Take Snapshot
                                                            </Button>
                                                        </Space>
                                                    </div>

                                                    <div style={{
                                                        flex: 1,
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        padding: 24,
                                                        width: '100%',
                                                        overflow: 'auto'
                                                    }}>
                                                        {screenshotUrl ? (
                                                            <div style={{
                                                                borderRadius: 12,
                                                                overflow: 'hidden',
                                                                border: `2px solid ${token.colorBorder}`,
                                                                boxShadow: '0 8px 24px rgba(0,0,0,0.15)'
                                                            }}>
                                                                <img
                                                                    src={screenshotUrl}
                                                                    alt="Device Screen"
                                                                    style={{ maxHeight: '65vh', display: 'block', maxWidth: '100%' }}
                                                                />
                                                            </div>
                                                        ) : (
                                                            <Empty description="No screenshot taken yet." />
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        },
                                        {
                                            key: 'repl',
                                            label: (
                                                <span>
                                                    <PlayCircleOutlined style={{ marginRight: 6 }} />
                                                    JS REPL
                                                </span>
                                            ),
                                            children: (
                                                <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                                                    <div style={{
                                                        flex: 1,
                                                        overflowY: 'auto',
                                                        padding: 14,
                                                        borderRadius: 12,
                                                        background: token.colorBgLayout,
                                                        border: `1px solid ${token.colorBorder}`,
                                                        fontFamily: 'var(--font-family-mono)',
                                                        fontSize: 13
                                                    }}>
                                                        {replOutputs.length === 0 ? (
                                                            <Text style={{ color: token.colorTextSecondary }}>
                                                                Type a JavaScript expression below and press Enter to execute on the mobile device.
                                                            </Text>
                                                        ) : (
                                                            replOutputs.map(out => (
                                                                <div key={out.id} style={{ marginBottom: 10 }}>
                                                                    {out.isInput ? (
                                                                        <div style={{ color: token.colorPrimary, fontWeight: 600 }}>
                                                                            &gt; {out.code}
                                                                        </div>
                                                                    ) : (
                                                                        <div style={{
                                                                            color: out.isError ? token.colorError : token.colorSuccess,
                                                                            paddingLeft: 12,
                                                                            whiteSpace: 'pre-wrap'
                                                                        }}>
                                                                            &lt; {out.result}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            ))
                                                        )}
                                                        <div ref={replEndRef} />
                                                    </div>

                                                    <div style={{ display: 'flex', gap: 10, marginTop: 12, flexWrap: 'nowrap' }}>
                                                        <Input
                                                            prefix={<span style={{ fontFamily: 'var(--font-family-mono)', color: token.colorPrimary }}>&gt;</span>}
                                                            placeholder={isMobile ? 'e.g. document.title' : 'e.g. document.title, window.location.href, 2 + 2'}
                                                            value={replInput}
                                                            onChange={(e) => setReplInput(e.target.value)}
                                                            onKeyDown={(e) => {
                                                                if (e.key === 'Enter') {
                                                                    executeREPLExpression();
                                                                } else if (e.key === 'ArrowUp') {
                                                                    if (replHistory.length > 0) {
                                                                        const nextIdx = replHistoryIndex < 0 ? replHistory.length - 1 : Math.max(0, replHistoryIndex - 1);
                                                                        setReplHistoryIndex(nextIdx);
                                                                        setReplInput(replHistory[nextIdx]);
                                                                    }
                                                                } else if (e.key === 'ArrowDown') {
                                                                    if (replHistoryIndex >= 0) {
                                                                        const nextIdx = replHistoryIndex + 1;
                                                                        if (nextIdx >= replHistory.length) {
                                                                            setReplHistoryIndex(-1);
                                                                            setReplInput('');
                                                                        } else {
                                                                            setReplHistoryIndex(nextIdx);
                                                                            setReplInput(replHistory[nextIdx]);
                                                                        }
                                                                    }
                                                                }
                                                            }}
                                                            style={{ fontFamily: 'var(--font-family-mono)' }}
                                                        />
                                                        <Button
                                                            type="primary"
                                                            icon={<PlayCircleOutlined />}
                                                            loading={executingJS}
                                                            onClick={executeREPLExpression}
                                                            aria-label="Execute"
                                                            style={{ flexShrink: 0 }}
                                                        >
                                                            {isMobile ? null : 'Execute'}
                                                        </Button>
                                                        <Button
                                                            icon={<ClearOutlined />}
                                                            onClick={() => setReplOutputs([])}
                                                            aria-label="Clear output"
                                                            style={{ flexShrink: 0 }}
                                                        >
                                                            {isMobile ? null : 'Clear'}
                                                        </Button>
                                                    </div>
                                                </div>
                                            )
                                        }
                                    ]}
                                />
                            </div>
                        )}
                    </Content>
                </Layout>
            );
        }

        // Root App: ThemeProvider owns the mode and wraps ConfigProvider
        function App() {
            return (
                <ThemeProvider>
                    <AntApp>
                        <Dashboard />
                    </AntApp>
                </ThemeProvider>
            );
        }

        // Mount React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
