<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vConsole Remote Dashboard</title>

    <!-- Google Fonts: Inter & Kantumruy Pro (Strict Compliance with Flutter AppTheme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- React 18 & ReactDOM -->
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
    ></script>

    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/dayjs.min.js"></script>

    <!-- Ant Design 5 & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/antd@5.18.3/dist/antd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@5.3.7/dist/index.umd.min.js"></script>

    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
      :root {
        --font-family:
          "Inter", "Kantumruy Pro", "KantumruyPro", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-family-mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
          Consolas, monospace;

        /* Light palette — mirrors AppColors.light */
        --app-bg-base: #faf9f5;
        --app-bg-container: #f4f3ee;
        --app-bg-elevated: #eceae1;
        --app-border: #e3e1d9;
        --app-text: #1f1e1c;
        --app-text-secondary: #6b6862;
        --app-text-tertiary: #b1ada1;
        --app-primary: #c15f3c;
        --app-success: #4a7862;
        --app-warning: #b08838;
        --app-error: #b3492f;
        --app-scrollbar: rgba(107, 104, 98, 0.28);
        --app-scrollbar-hover: rgba(107, 104, 98, 0.48);
        color-scheme: light;
      }

      /* Dark palette — mirrors AppColors.dark; the class is set by ThemeProvider */
      html.dark {
        --app-bg-base: #1a1917;
        --app-bg-container: #26241f;
        --app-bg-elevated: #322f29;
        --app-border: #3d3a33;
        --app-text: #f4f3ee;
        --app-text-secondary: #b1ada1;
        --app-text-tertiary: #7a766d;
        --app-primary: #d97b57;
        --app-success: #6fa085;
        --app-warning: #d0a85c;
        --app-error: #d9705a;
        --app-scrollbar: rgba(177, 173, 161, 0.28);
        --app-scrollbar-hover: rgba(177, 173, 161, 0.48);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        font-family: var(--font-family);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body {
        background: var(--app-bg-base);
        color: var(--app-text);
      }

      /* Subtle scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--app-scrollbar);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--app-scrollbar-hover);
      }

      /* Live status dot pulsing */
      @keyframes pulse-dot {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(74, 120, 98, 0.55);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(74, 120, 98, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(74, 120, 98, 0);
        }
      }
      .status-dot-active {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--app-success);
        animation: pulse-dot 2s infinite;
        display: inline-block;
      }
      .status-dot-waiting {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--app-warning);
        display: inline-block;
      }
      .status-dot-disconnected {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--app-error);
        display: inline-block;
      }

      .mono-text {
        font-family: var(--font-family-mono);
        font-size: 12.5px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* Responsive Breakpoints */
      @media (max-width: 768px) {
        .hide-on-mobile {
          display: none !important;
        }
        .header-title-text {
          font-size: 14px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: var(--app-bg-base);
          color: var(--app-text);
          font-family: var(--font-family);
        "
      >
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 8px">
          vConsole Remote Dashboard
        </div>
        <p style="color: var(--app-text-tertiary); font-size: 13px">
          Loading React & Ant Design interface...
        </p>
      </div>
    </div>

    <script type="text/babel">
            const { useState, useEffect, useRef, useMemo, useContext, useCallback } =
              React;
            const {
              ConfigProvider,
              App: AntApp,
              theme: antTheme,
              Layout,
              Card,
              Button,
              Input,
              Tabs,
              Table,
              Tag,
              Badge,
              Space,
              Typography,
              Tooltip,
              Switch,
              Modal,
              Drawer,
              Row,
              Col,
              Empty,
              Spin,
              Segmented,
              Alert,
              Divider,
              Grid,
              Progress,
            } = antd;

            const { Header, Content } = Layout;
            const { Text, Title } = Typography;

            // Ant Design Icons from UMD
            const Icons = window.AntDesignIcons || window.icons || {};
            const ThunderboltOutlined =
              Icons.ThunderboltOutlined || (() => <span>⚡</span>);
            const ReloadOutlined = Icons.ReloadOutlined || (() => <span>🔄</span>);
            const ClearOutlined = Icons.ClearOutlined || (() => <span>🗑️</span>);
            const CopyOutlined = Icons.CopyOutlined || (() => <span>📋</span>);
            const DownloadOutlined =
              Icons.DownloadOutlined || (() => <span>⬇️</span>);
            const SunOutlined = Icons.SunOutlined || (() => <span>☀️</span>);
            const MoonOutlined = Icons.MoonOutlined || (() => <span>🌙</span>);
            const MobileOutlined = Icons.MobileOutlined || (() => <span>📱</span>);
            const LaptopOutlined = Icons.LaptopOutlined || (() => <span>💻</span>);
            const ApiOutlined = Icons.ApiOutlined || (() => <span>🌐</span>);
            const DatabaseOutlined =
              Icons.DatabaseOutlined || (() => <span>💾</span>);
            const BranchesOutlined =
              Icons.BranchesOutlined || (() => <span>🌳</span>);
            const CameraOutlined = Icons.CameraOutlined || (() => <span>📸</span>);
            const CodeOutlined = Icons.CodeOutlined || (() => <span>💻</span>);
            const SearchOutlined = Icons.SearchOutlined || (() => <span>🔍</span>);
            const CheckCircleOutlined =
              Icons.CheckCircleOutlined || (() => <span>✅</span>);
            const ExclamationCircleOutlined =
              Icons.ExclamationCircleOutlined || (() => <span>⚠️</span>);
            const CloseCircleOutlined =
              Icons.CloseCircleOutlined || (() => <span>❌</span>);
            const PlayCircleOutlined =
              Icons.PlayCircleOutlined || (() => <span>▶️</span>);
            const CheckOutlined = Icons.CheckOutlined || (() => <span>✓</span>);
            const CloseOutlined = Icons.CloseOutlined || (() => <span>✕</span>);
            const ArrowUpOutlined = Icons.ArrowUpOutlined || (() => <span>↑</span>);
            const ArrowDownOutlined = Icons.ArrowDownOutlined || (() => <span>↓</span>);
            const RightOutlined = Icons.RightOutlined || (() => <span>&gt;</span>);
            const ExpandOutlined = Icons.ExpandOutlined || (() => <span>⊞</span>);

            /**
             * Parse URL Query String into key-value map for Network Payload tab
             */
            function parseQueryParams(urlStr) {
              try {
                const url = new URL(urlStr, 'http://localhost');
                const params = {};
                for (const [key, value] of url.searchParams.entries()) {
                  if (params[key]) {
                    if (Array.isArray(params[key])) {
                      params[key].push(value);
                    } else {
                      params[key] = [params[key], value];
                    }
                  } else {
                    params[key] = value;
                  }
                }
                return params;
              } catch {
                return {};
              }
            }

            /**
             * Format Top Bar Telemetry Pills (OS, Screen, Network, Latency)
             */
            function formatTelemetryPills(telemetry, latencyMs = null) {
              if (!telemetry) return { osPill: '', screenPill: '', networkPill: '', latencyPill: '' };
              const osPill = telemetry.os?.version
                ? `${telemetry.os.name} ${telemetry.os.version}`
                : (telemetry.os?.name || 'Unknown');

              const dpr = telemetry.screen?.dpr || telemetry.screen?.pixelRatio || 1;
              const screenPill = telemetry.screen
                ? `${telemetry.screen.width}×${telemetry.screen.height} @${dpr}x`
                : '';

              let networkPill;
              if (!telemetry.network || !telemetry.network.online) {
                networkPill = 'Offline';
              } else if (telemetry.network.effectiveType && telemetry.network.effectiveType !== 'unknown') {
                const speed = telemetry.network.downlink ? ` (${telemetry.network.downlink}Mbps)` : '';
                networkPill = `${telemetry.network.effectiveType.toUpperCase()}${speed}`;
              } else {
                networkPill = 'Online';
              }

              const latencyPill = latencyMs !== null ? `Ping: ${Math.round(latencyMs)}ms` : 'Ping: --';

              return { osPill, screenPill, networkPill, latencyPill };
            }

            /**
             * Calculate Console Log Level Badges (Error, Warn, Info)
             */
            function calculateBadgeCounts(logStream) {
              const counts = { error: 0, warn: 0, info: 0, all: 0 };
              for (const entry of logStream) {
                counts.all++;
                const lvl = (entry.level || 'info').toLowerCase();
                if (lvl === 'error') counts.error++;
                else if (lvl === 'warn' || lvl === 'warning') counts.warn++;
                else if (lvl === 'info' || lvl === 'log' || lvl === 'debug') counts.info++;
              }
              return counts;
            }

            /**
             * Map Device Telemetry to 6-Card System Information Grid
             */
            function mapSystemInfoCards(telemetry) {
              if (!telemetry) return null;
              return {
                systemOverview: {
                  os: `${telemetry.os?.name || ''} ${telemetry.os?.version || ''}`.trim(),
                  platform: telemetry.hardware?.platform || 'Unknown',
                  browser: `${telemetry.browser?.name || ''} (${telemetry.browser?.engine || ''})`
                },
                displaySpecs: {
                  resolution: `${telemetry.screen?.width || 0}×${telemetry.screen?.height || 0}`,
                  viewport: `${telemetry.viewport?.width || 0}×${telemetry.viewport?.height || 0}`,
                  dpr: `${telemetry.screen?.dpr || telemetry.screen?.pixelRatio || 1}x`,
                  colorDepth: `${telemetry.screen?.colorDepth || 0}-bit`
                },
                networkSpecs: {
                  status: telemetry.network?.online ? 'Online' : 'Offline',
                  effectiveType: telemetry.network?.effectiveType || 'unknown',
                  downlink: telemetry.network?.downlink ? `${telemetry.network.downlink} Mbps` : 'N/A',
                  rtt: telemetry.network?.rtt ? `${telemetry.network.rtt} ms` : 'N/A'
                },
                batterySpecs: {
                  supported: !!telemetry.battery?.supported,
                  level: (telemetry.battery?.level !== null && telemetry.battery?.level !== undefined) ? `${Math.round(telemetry.battery.level * 100)}%` : 'N/A',
                  charging: telemetry.battery?.charging ? 'Charging' : 'Discharging'
                },
                featuresMatrix: telemetry.features || {},
                hardwareSensors: {
                  concurrency: `${telemetry.hardware?.concurrency || 0} Cores`,
                  memory: telemetry.hardware?.memory ? `${telemetry.hardware.memory} GB` : 'N/A'
                }
              };
            }

            /**
             * Simulate Master-Detail Keyboard Navigation in Network Tab
             */
            function simulateNetworkKeyboardNav(requests, currentIndex, key) {
              if (key === 'Escape') return null; // Deselect and close detail pane
              if (key === 'ArrowDown') return Math.min(requests.length - 1, currentIndex + 1);
              if (key === 'ArrowUp') return Math.max(0, currentIndex - 1);
              return currentIndex;
            }

            /**
             * Format In-Stream REPL Display Item
             */
            function formatReplStreamItem(type, content, isError = false) {
              const prefix = type === 'input' ? '>' : '<';
              return {
                prefix,
                type,
                formatted: `${prefix} ${content}`,
                isError: !!isError,
                timestamp: Date.now()
              };
            }

            /**
             * Design tokens.
             * - Fonts: 'Inter', 'Kantumruy Pro'
             * - Shapes: 12px radius for cards, 8px for buttons and inputs, 10px base
             * - Controls: 42px high, flat (no elevation), 1px outline borders
             * - Colours: warm paper / charcoal surfaces with a terracotta accent
             */
            const AppColors = {
              // Light — warm paper surfaces with a terracotta accent
              light: {
                bgBase: "#FAF9F5",
                bgContainer: "#F4F3EE",
                bgElevated: "#ECEAE1",
                border: "#E3E1D9",
                text: "#1F1E1C",
                textSecondary: "#6B6862",
                textTertiary: "#B1ADA1",
                primary: "#C15F3C",
                primaryHover: "#A94F30",
                primaryActive: "#8E3F24",
                success: "#4A7862",
                warning: "#B08838",
                error: "#B3492F",
                onPrimary: "#FFFFFF",
              },
              // Dark — warm charcoal surfaces with a lifted terracotta accent
              dark: {
                bgBase: "#1A1917",
                bgContainer: "#26241F",
                bgElevated: "#322F29",
                border: "#3D3A33",
                text: "#F4F3EE",
                textSecondary: "#B1ADA1",
                textTertiary: "#7A766D",
                primary: "#D97B57",
                primaryHover: "#E68F6D",
                primaryActive: "#C15F3C",
                success: "#6FA085",
                warning: "#D0A85C",
                error: "#D9705A",
                onPrimary: "#1A1917",
              },
            };

            const fontFamilyStack =
              "'Inter', 'Kantumruy Pro', 'KantumruyPro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";

            /**
             * Build an Ant Design ThemeConfig from one of the palettes above.
             * Both modes share the same shape scale, so only colour changes between them.
             */
            const buildThemeConfig = (palette, algorithm) => ({
              ...(algorithm ? { algorithm } : {}),
              token: {
                fontFamily: fontFamilyStack,
                colorBgBase: palette.bgBase,
                colorBgLayout: palette.bgBase,
                colorBgContainer: palette.bgContainer,
                colorBgElevated: palette.bgElevated,
                colorBorder: palette.border,
                colorBorderSecondary: palette.border,
                colorText: palette.text,
                colorTextSecondary: palette.textSecondary,
                colorTextTertiary: palette.textTertiary,
                colorTextDescription: palette.textTertiary,
                colorPrimary: palette.primary,
                colorPrimaryHover: palette.primaryHover,
                colorInfo: palette.primary,
                colorLink: palette.primary,
                colorLinkHover: palette.primaryHover,
                colorSuccess: palette.success,
                colorWarning: palette.warning,
                colorError: palette.error,
                borderRadius: 10,
                borderRadiusLG: 12,
                borderRadiusSM: 6,
                controlHeight: 42,
              },
              components: {
                Layout: {
                  bodyBg: palette.bgBase,
                  headerBg: palette.bgBase,
                  footerBg: palette.bgBase,
                  headerHeight: 72,
                  headerPadding: "0 16px",
                  headerColor: palette.text,
                },
                Button: {
                  controlHeight: 42,
                  fontWeight: 600,
                  primaryColor: palette.onPrimary,
                  colorPrimary: palette.primary,
                  colorPrimaryHover: palette.primaryHover,
                  colorPrimaryActive: palette.primaryActive,
                  borderRadius: 8,
                  primaryShadow: "none",
                },
                Card: {
                  colorBgContainer: palette.bgContainer,
                  colorBorderSecondary: palette.border,
                  borderRadiusLG: 12,
                  paddingLG: 16,
                  boxShadow: "none",
                  boxShadowTertiary: "none",
                },
                Table: {
                  colorBgContainer: palette.bgContainer,
                  headerBg: palette.bgElevated,
                  borderColor: palette.border,
                  headerColor: palette.text,
                  rowHoverBg: palette.bgElevated,
                },
                Tabs: {
                  itemColor: palette.textSecondary,
                  itemHoverColor: palette.primary,
                  itemSelectedColor: palette.primary,
                  inkBarColor: palette.primary,
                  titleFontSize: 14,
                },
                Input: {
                  colorBgContainer: palette.bgBase,
                  colorBorder: palette.border,
                  colorText: palette.text,
                  hoverBorderColor: palette.primary,
                  activeBorderColor: palette.primary,
                  borderRadius: 8,
                },
                Tag: {
                  borderRadiusSM: 6,
                },
                Modal: {
                  contentBg: palette.bgContainer,
                  headerBg: palette.bgContainer,
                },
                Drawer: {
                  colorBgElevated: palette.bgContainer,
                  borderRadiusLG: 12,
                },
                Segmented: {
                  itemSelectedBg: palette.bgElevated,
                  itemSelectedColor: palette.primary,
                },
                Alert: {
                  borderRadiusLG: 12,
                },
              },
            });

            const lightThemeConfig = buildThemeConfig(AppColors.light, null);
            const darkThemeConfig = buildThemeConfig(
              AppColors.dark,
              antTheme.darkAlgorithm,
            );

            /**
             * Theme mode context. A single source of truth shared by the provider that
             * feeds ConfigProvider and the toggle inside the dashboard — two separate
             * useState hooks would leave ConfigProvider on a stale mode.
             */
            const THEME_STORAGE_KEY = "dg_mini_theme_mode";

            const ThemeContext = React.createContext({
              mode: "light",
              toggleTheme: () => {},
              setMode: () => {},
            });

            const useThemeMode = () => useContext(ThemeContext);

            function ThemeProvider({ children }) {
              const [mode, setMode] = useState(() => {
                try {
                  return localStorage.getItem(THEME_STORAGE_KEY) === "dark"
                    ? "dark"
                    : "light";
                } catch (_) {
                  return "light";
                }
              });

              useEffect(() => {
                try {
                  localStorage.setItem(THEME_STORAGE_KEY, mode);
                } catch (_) {}
                document.documentElement.classList.toggle("dark", mode === "dark");
                document.documentElement.style.colorScheme = mode;
              }, [mode]);

              // Keep other tabs of the dashboard in sync
              useEffect(() => {
                const listener = (event) => {
                  if (event.key === THEME_STORAGE_KEY && event.newValue) {
                    setMode(event.newValue === "dark" ? "dark" : "light");
                  }
                };
                window.addEventListener("storage", listener);
                return () => window.removeEventListener("storage", listener);
              }, []);

              const value = useMemo(
                () => ({
                  mode,
                  setMode,
                  toggleTheme: () =>
                    setMode((prev) => (prev === "light" ? "dark" : "light")),
                }),
                [mode],
              );

              return (
                <ThemeContext.Provider value={value}>
                  <ConfigProvider
                    theme={mode === "dark" ? darkThemeConfig : lightThemeConfig}
                  >
                    {children}
                  </ConfigProvider>
                </ThemeContext.Provider>
              );
            }

            // Inner Dashboard Component (Consumes Ant Design Theme Tokens & App Hooks)
            function Dashboard() {
              const { message: antMessage } = AntApp.useApp();
              const { token } = antTheme.useToken();

              // Theme mode from the shared provider that also drives ConfigProvider
              const { mode, toggleTheme } = useThemeMode();
              const isDarkMode = mode === "dark";
              const palette = isDarkMode ? AppColors.dark : AppColors.light;

              // Responsive breakpoints drive layout density across the dashboard
              const screens = Grid.useBreakpoint();
              const isMobile = !screens.md;
              const isCompact = !screens.lg;

              // WebSocket & Room States
              const [roomPin, setRoomPin] = useState("");
              const [roomKey, setRoomKey] = useState("");
              const [pinInputValue, setPinInputValue] = useState("");
              const [connectionStatus, setConnectionStatus] =
                useState("disconnected"); // 'disconnected' | 'connecting' | 'awaiting_approval' | 'connected'
              const [authNotice, setAuthNotice] = useState(null);
              const [deviceConnected, setDeviceConnected] = useState(false);
              const [activeTab, setActiveTab] = useState("console");
              const wsRef = useRef(null);
              // Tracks the room this tab is currently attached to. connectToRoom
              // rewrites the hash, which fires hashchange and would otherwise
              // start a second connection that races the first for the room's
              // single developer slot.
              const activePinRef = useRef("");

              // Device Telemetry & Latency Heartbeat States
              const [telemetryData, setTelemetryData] = useState(null);
              const [latency, setLatency] = useState(null);
              const [refreshingSystem, setRefreshingSystem] = useState(false);
              const pingIntervalRef = useRef(null);

              // Tab Data States
              const [logs, setLogs] = useState([]);
              const [logLevelFilter, setLogLevelFilter] = useState("all");
              const [logSearchQuery, setLogSearchQuery] = useState("");
              const [autoScrollLogs, setAutoScrollLogs] = useState(true);
              const logsEndRef = useRef(null);

              // Network Requests
              const MAX_NETWORK_REQUESTS = 500;
              const [networkRequests, setNetworkRequests] = useState([]);
              const [networkSearchQuery, setNetworkSearchQuery] = useState("");
              const [selectedRequest, setSelectedRequest] = useState(null);
              const [networkBodyMap, setNetworkBodyMap] = useState({});
              const [fetchingNetworkBody, setFetchingNetworkBody] = useState(false);
              const networkBatchQueueRef = useRef([]);
              const networkBatchTimerRef = useRef(null);

              const flushNetworkBatch = useCallback(() => {
                if (networkBatchQueueRef.current.length === 0) return;
                const batch = networkBatchQueueRef.current;
                networkBatchQueueRef.current = [];
                networkBatchTimerRef.current = null;

                setNetworkRequests((prev) => {
                  const map = new Map(prev.map((r) => [r.id, r]));
                  for (const req of batch) {
                    if (map.has(req.id)) {
                      map.set(req.id, { ...map.get(req.id), ...req });
                    } else {
                      map.set(req.id, req);
                    }
                  }
                  const next = Array.from(map.values());
                  if (next.length > MAX_NETWORK_REQUESTS) {
                    return next.slice(next.length - MAX_NETWORK_REQUESTS);
                  }
                  return next;
                });
              }, []);

              const clearNetworkRequests = useCallback(() => {
                networkBatchQueueRef.current = [];
                if (networkBatchTimerRef.current) {
                  clearTimeout(networkBatchTimerRef.current);
                  networkBatchTimerRef.current = null;
                }
                setNetworkRequests([]);
                setNetworkBodyMap({});
              }, []);

              useEffect(() => {
                return () => {
                  if (networkBatchTimerRef.current) {
                    clearTimeout(networkBatchTimerRef.current);
                  }
                };
              }, []);

              // Storage Data
              const [storageData, setStorageData] = useState({
                localStorage: [],
                sessionStorage: [],
                cookies: [],
              });
              const [selectedStorageType, setSelectedStorageType] =
                useState("localStorage");
              const [storageSearchQuery, setStorageSearchQuery] = useState("");
              const [fetchingStorage, setFetchingStorage] = useState(false);

              // DOM Tree Data
              const [domTree, setDomTree] = useState(null);
              const [fetchingDomTree, setFetchingDomTree] = useState(false);

              // Screenshot Data
              const [screenshotUrl, setScreenshotUrl] = useState(null);
              const [screenshotTimestamp, setScreenshotTimestamp] = useState(null);
              const [fetchingScreenshot, setFetchingScreenshot] = useState(false);

              // REPL Console
              const [replInput, setReplInput] = useState("");
              const [replHistory, setReplHistory] = useState([]);
              const [replHistoryIndex, setReplHistoryIndex] = useState(-1);
              const [replOutputs, setReplOutputs] = useState([]);
              const [executingJS, setExecutingJS] = useState(false);
              const replEndRef = useRef(null);

              // Auto-scroll logs
              useEffect(() => {
                if (autoScrollLogs && logsEndRef.current) {
                  logsEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
              }, [logs, autoScrollLogs]);

              // Auto-scroll REPL
              useEffect(() => {
                if (replEndRef.current) {
                  replEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
              }, [replOutputs]);

              // Master-Detail Network Keyboard Navigation (Escape to close, ArrowUp/ArrowDown to navigate)
              useEffect(() => {
                if (activeTab !== "network" || !selectedRequest) return;
                const handleKeyDown = (e) => {
                  if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
                  if (e.key === "Escape" || e.key === "ArrowDown" || e.key === "ArrowUp") {
                    e.preventDefault();
                    const currentIndex = filteredRequests.findIndex((r) => r.id === selectedRequest.id);
                    const nextIndex = simulateNetworkKeyboardNav(filteredRequests, currentIndex, e.key);
                    if (nextIndex === null) {
                      setSelectedRequest(null);
                    } else if (nextIndex >= 0 && nextIndex < filteredRequests.length) {
                      setSelectedRequest(filteredRequests[nextIndex]);
                    }
                  }
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
              }, [activeTab, selectedRequest, filteredRequests]);

              // Periodic Latency Heartbeat (every 6 seconds when connected to mobile device)
              useEffect(() => {
                if (connectionStatus === "connected" && deviceConnected) {
                  sendWebSocketMessage({ type: "device_ping", timestamp: Date.now() });
                  pingIntervalRef.current = setInterval(() => {
                    sendWebSocketMessage({ type: "device_ping", timestamp: Date.now() });
                  }, 6000);
                  return () => {
                    if (pingIntervalRef.current) {
                      clearInterval(pingIntervalRef.current);
                      pingIntervalRef.current = null;
                    }
                  };
                } else {
                  if (pingIntervalRef.current) {
                    clearInterval(pingIntervalRef.current);
                    pingIntervalRef.current = null;
                  }
                  setLatency(null);
                }
              }, [connectionStatus, deviceConnected]);

              // Parse URL Hash on Mount
              useEffect(() => {
                const parseHash = () => {
                  const hash = window.location.hash;
                  const match = hash.match(/#\/room\/(\d{6})(?:\/([a-z]+))?/);
                  if (match) {
                    const pin = match[1];
                    const tab = match[2];
                    // The QR code appends the room secret as ?key=<hex>
                    const keyMatch = hash.match(/[?&]key=([A-Za-z0-9_-]+)/);
                    const key = keyMatch ? keyMatch[1] : "";
                    setPinInputValue(pin);
                    if (
                      tab &&
                      [
                        "console",
                        "network",
                        "system",
                        "storage",
                        "dom",
                        "screenshot",
                        "repl",
                      ].includes(tab)
                    ) {
                      setActiveTab(tab);
                    }
                    if (activePinRef.current !== pin) {
                      connectToRoom(pin, key, tab);
                    }
                  }
                };
                parseHash();
                window.addEventListener("hashchange", parseHash);
                return () => window.removeEventListener("hashchange", parseHash);
              }, []);

              // Connect to Room
              const connectToRoom = (pinToConnect, keyToUse, tabToOpen) => {
                const rawPin = (pinToConnect || pinInputValue).replace(/\D/g, "");
                if (rawPin.length !== 6) {
                  antMessage.error("Please enter a valid 6-digit room PIN.");
                  return;
                }

                if (wsRef.current) {
                  wsRef.current.close();
                }

                const key = keyToUse !== undefined ? keyToUse : roomKey;

                activePinRef.current = rawPin;
                setConnectionStatus("connecting");
                setAuthNotice(null);
                setRoomPin(rawPin);
                setRoomKey(key || "");
                const targetTab = tabToOpen || activeTab;
                window.location.hash = key
                  ? `#/room/${rawPin}/${targetTab}?key=${encodeURIComponent(key)}`
                  : `#/room/${rawPin}/${targetTab}`;

                const protocol =
                  window.location.protocol === "https:" ? "wss:" : "ws:";
                // The PIN is sent in-band rather than as a query parameter so the
                // server can answer a refusal with a reason the UI can explain.
                const wsUrl = `${protocol}//${window.location.host}/ws?type=developer`;

                try {
                  const ws = new WebSocket(wsUrl);
                  wsRef.current = ws;

                  ws.onopen = () => {
                    ws.send(
                      JSON.stringify({
                        type: "connect_room",
                        pin: rawPin,
                        key: key || undefined,
                      }),
                    );
                  };

                  ws.onmessage = (event) => {
                    try {
                      const data = JSON.parse(event.data);
                      handleIncomingMessage(data);
                    } catch (err) {
                      console.warn("Received non-JSON frame:", event.data);
                    }
                  };

                  ws.onerror = (error) => {
                    console.error("WebSocket error:", error);
                    setConnectionStatus("disconnected");
                  };

                  ws.onclose = (event) => {
                    activePinRef.current = "";
                    setConnectionStatus((prev) => {
                      // Closing before pairing completed means the server refused
                      // the socket outright (unknown room, room busy, or a
                      // temporary block after repeated failed attempts).
                      if (prev === "connecting") {
                        setAuthNotice(
                          (current) =>
                            current || {
                              type: "error",
                              title: "Connection refused",
                              detail:
                                "The room may not exist, may already be in use by another developer, or this network is temporarily blocked after too many failed attempts.",
                            },
                        );
                      }
                      return "disconnected";
                    });
                    setDeviceConnected(false);
                  };
                } catch (e) {
                  activePinRef.current = "";
                  setConnectionStatus("disconnected");
                  antMessage.error("Failed to initialize WebSocket connection.");
                }
              };

              const disconnectRoom = () => {
                if (pingIntervalRef.current) {
                  clearInterval(pingIntervalRef.current);
                  pingIntervalRef.current = null;
                }
                if (wsRef.current) {
                  wsRef.current.close();
                  wsRef.current = null;
                }
                activePinRef.current = "";
                setConnectionStatus("disconnected");
                setDeviceConnected(false);
                setTelemetryData(null);
                setLatency(null);
                setRoomPin("");
                setRoomKey("");
                setAuthNotice(null);
                window.location.hash = "";
                antMessage.info("Disconnected from debug session.");
              };

              const sendWebSocketMessage = (payload) => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                  wsRef.current.send(JSON.stringify(payload));
                  return true;
                }
                antMessage.warning("WebSocket is not connected to any device.");
                return false;
              };

              /**
               * Flatten one storage bucket into [{ key, value }].
               *
               * The same field arrives in three different shapes depending on the
               * client and the field: `storage.*` carries arrays of {key, value},
               * `data.*` carries object maps, and cookies can arrive as a raw
               * `document.cookie` string. This panel renders whatever a device
               * sends it, so an unexpected shape must degrade to an empty list
               * rather than throw — a render-time exception here unmounts the
               * whole dashboard, not just this tab.
               */
              const normalizeStorageEntries = (input) => {
                const toText = (value) => {
                  if (typeof value === "string") return value;
                  if (value === null || value === undefined) return "";
                  try {
                    return JSON.stringify(value);
                  } catch (_) {
                    return String(value);
                  }
                };

                if (!input) return [];

                // Raw cookie header: "a=1; b=2"
                if (typeof input === "string") {
                  return input
                    .split(";")
                    .map((pair, idx) => {
                      const eq = pair.indexOf("=");
                      const key = (eq > -1 ? pair.slice(0, eq) : pair).trim();
                      const value = eq > -1 ? pair.slice(eq + 1).trim() : "";
                      return { key: key || `cookie_${idx}`, value };
                    })
                    .filter((item) => item.key);
                }

                if (Array.isArray(input)) {
                  return input.map((entry, idx) => {
                    if (entry && typeof entry === "object") {
                      return {
                        key: toText(entry.key) || `item_${idx}`,
                        value: toText(entry.value),
                      };
                    }
                    return { key: `item_${idx}`, value: toText(entry) };
                  });
                }

                if (typeof input === "object") {
                  return Object.keys(input).map((key) => ({
                    key,
                    value: toText(input[key]),
                  }));
                }

                return [];
              };

              const handleIncomingMessage = (msg) => {
                if (!msg || !msg.type) return;

                switch (msg.type) {
                  case "auth_pending":
                    setConnectionStatus("awaiting_approval");
                    setAuthNotice({
                      type: "pending",
                      title: "Waiting for device approval",
                      detail: `Approve this connection on the mobile device. The request expires in ${msg.expiresIn || 60} seconds.`,
                    });
                    break;
                  case "auth_rejected":
                    setAuthNotice({
                      type: "error",
                      title: "Connection rejected",
                      detail: "The device owner rejected this debug session.",
                    });
                    setConnectionStatus("disconnected");
                    antMessage.error("The device owner rejected this connection.");
                    break;
                  case "auth_timeout":
                    setAuthNotice({
                      type: "error",
                      title: "Approval timed out",
                      detail:
                        "The device did not answer the authorization request. Try again when the device is unlocked.",
                    });
                    setConnectionStatus("disconnected");
                    antMessage.warning("Authorization request timed out.");
                    break;
                  case "rate_limited":
                    setAuthNotice({
                      type: "error",
                      title: "Too many failed attempts",
                      detail:
                        msg.message ||
                        "This network is temporarily blocked. Wait for the cooldown to end and try again.",
                    });
                    setConnectionStatus("disconnected");
                    antMessage.error(msg.message || "Too many failed attempts.");
                    break;
                  case "session_expired":
                    setAuthNotice({
                      type: "error",
                      title:
                        msg.reason === "max_duration"
                          ? "Session reached its time limit"
                          : "Session closed after inactivity",
                      detail:
                        msg.message || "The debug session was closed by the server.",
                    });
                    setConnectionStatus("disconnected");
                    setDeviceConnected(false);
                    antMessage.warning(msg.message || "Debug session expired.");
                    break;
                  case "room_connected":
                    setConnectionStatus("connected");
                    setAuthNotice(null);
                    setDeviceConnected(true);
                    antMessage.success(`Connected to Room ${msg.pin || ""}`);
                    sendWebSocketMessage({ type: "pull_device_info" });
                    break;
                  case "device_connected":
                    setDeviceConnected(true);
                    antMessage.success("Mobile device paired successfully!");
                    sendWebSocketMessage({ type: "device_ping", timestamp: Date.now() });
                    sendWebSocketMessage({ type: "pull_device_info" });
                    break;
                  case "device_disconnected":
                    setDeviceConnected(false);
                    setLatency(null);
                    antMessage.warning("Mobile device disconnected.");
                    break;
                  case "device_telemetry": {
                    const tel = msg.data || msg.telemetry || msg;
                    setTelemetryData(tel);
                    setRefreshingSystem(false);
                    break;
                  }
                  case "device_pong": {
                    if (msg.timestamp) {
                      const roundTrip = Math.max(0, Date.now() - msg.timestamp);
                      setLatency(roundTrip);
                    }
                    break;
                  }
                  case "console":
                  case "log":
                    setLogs((prev) => [
                      ...prev,
                      {
                        id: Date.now() + Math.random(),
                        level: msg.level || "log",
                        args: msg.args || [msg.message || ""],
                        message: msg.message || (msg.args && msg.args[0]) || "",
                        timestamp: msg.timestamp || new Date().toISOString(),
                      },
                    ]);
                    break;
                  case "network":
                  case "network_request": {
                    const rawReq = msg.request || msg;
                    const reqUrl = rawReq.url || msg.url || "";
                    const reqItem = {
                      id:
                        rawReq.id ||
                        msg.id ||
                        `req-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                      url: reqUrl,
                      method: (rawReq.method || msg.method || "GET").toUpperCase(),
                      status:
                        rawReq.status !== undefined
                          ? rawReq.status
                          : msg.status !== undefined
                            ? msg.status
                            : 0,
                      duration:
                        rawReq.duration !== undefined
                          ? rawReq.duration
                          : msg.duration || 0,
                      headers:
                        rawReq.headers || rawReq.requestHeaders || msg.headers || {},
                      responseHeaders:
                        rawReq.responseHeaders || msg.responseHeaders || {},
                      timestamp:
                        rawReq.timestamp || msg.timestamp || new Date().toISOString(),
                      body: rawReq.body || rawReq.responseBody || msg.body || null,
                      requestBody:
                        rawReq.requestBody !== undefined
                          ? rawReq.requestBody
                          : (rawReq.payload !== undefined ? rawReq.payload : null),
                      queryParams:
                        rawReq.queryParams || parseQueryParams(reqUrl),
                    };

                    networkBatchQueueRef.current.push(reqItem);
                    if (!networkBatchTimerRef.current) {
                      networkBatchTimerRef.current = setTimeout(
                        flushNetworkBatch,
                        80,
                      );
                    }
                    break;
                  }
                  case "network_body":
                  case "network_body_data":
                    setFetchingNetworkBody(false);
                    if (msg.requestId) {
                      setNetworkBodyMap((prev) => ({
                        ...prev,
                        [msg.requestId]: msg.body || "",
                      }));
                    }
                    break;
                  case "storage_data": {
                    setFetchingStorage(false);
                    const source = msg.storage || msg.data;
                    if (source) {
                      setStorageData({
                        localStorage: normalizeStorageEntries(source.localStorage),
                        sessionStorage: normalizeStorageEntries(
                          source.sessionStorage,
                        ),
                        cookies: normalizeStorageEntries(source.cookies),
                      });
                      antMessage.success("Storage state synchronized.");
                    }
                    break;
                  }
                  case "dom_tree_data":
                    setFetchingDomTree(false);
                    if (msg.tree) {
                      setDomTree(msg.tree);
                      antMessage.success("DOM tree synchronized.");
                    }
                    break;
                  case "screenshot_data":
                  case "screenshot":
                    setFetchingScreenshot(false);
                    if (msg.dataUrl) {
                      setScreenshotUrl(msg.dataUrl);
                      setScreenshotTimestamp(new Date().toLocaleTimeString());
                      antMessage.success("Screen snapshot captured.");
                    }
                    break;
                  case "exec_result":
                  case "exec_js_result": {
                    setExecutingJS(false);
                    const now = Date.now();
                    const resVal =
                      msg.result !== undefined
                        ? msg.result
                        : msg.output !== undefined
                          ? msg.output
                          : msg.error || "undefined";
                    const isErr = !!msg.isError;

                    // Append to console log stream for in-stream execution display
                    setLogs((prev) => [
                      ...prev,
                      {
                        id: now + 1,
                        evalId: msg.evalId,
                        level: isErr ? "error" : "eval_output",
                        isReplOutput: true,
                        result: String(resVal),
                        isError: isErr,
                        timestamp: new Date(now).toISOString(),
                        args: [`< ${String(resVal)}`],
                      },
                    ]);

                    // Append to replOutputs for dedicated REPL tab parity
                    setReplOutputs((prev) => [
                      ...prev,
                      {
                        id: now + 1,
                        evalId: msg.evalId,
                        result: String(resVal),
                        isError: isErr,
                      },
                    ]);
                    break;
                  }
                  case "error": {
                    const titles = {
                      room_not_found: "Room not found",
                      room_busy: "Room already in use",
                      invalid_key: "Invalid room key",
                      invalid_pin: "Invalid PIN",
                      not_paired: "Not authorized for this room",
                    };
                    if (msg.reason && titles[msg.reason]) {
                      setAuthNotice({
                        type: "error",
                        title: titles[msg.reason],
                        detail:
                          msg.message || "The server refused this debug session.",
                      });
                      setConnectionStatus("disconnected");
                    }
                    antMessage.error(msg.message || "Server error received.");
                    break;
                  }
                  default:
                    break;
                }
              };

              const requestPullStorage = () => {
                setFetchingStorage(true);
                sendWebSocketMessage({ type: "pull_storage" });
              };

              const requestPullDomTree = () => {
                setFetchingDomTree(true);
                sendWebSocketMessage({ type: "pull_dom_tree" });
              };

              const requestPullScreenshot = () => {
                setFetchingScreenshot(true);
                sendWebSocketMessage({ type: "pull_screenshot" });
              };

              const requestPullNetworkBody = (requestId) => {
                setFetchingNetworkBody(true);
                sendWebSocketMessage({ type: "pull_network_body", requestId });
              };

              const filteredRequests = useMemo(() => {
                return networkRequests.filter((req) => {
                  if (networkSearchQuery) {
                    const query = networkSearchQuery.toLowerCase();
                    return (
                      (req.url || "").toLowerCase().includes(query) ||
                      (req.method || "").toLowerCase().includes(query)
                    );
                  }
                  return true;
                });
              }, [networkRequests, networkSearchQuery]);

              const filteredLogs = useMemo(() => {
                return logs.filter((log) => {
                  if (logLevelFilter !== "all") {
                    const lvl = (log.level || "log").toLowerCase();
                    if (logLevelFilter === "error" && lvl !== "error" && !log.isError) return false;
                    if (logLevelFilter === "warn" && lvl !== "warn" && lvl !== "warning") return false;
                    if (logLevelFilter === "info" && lvl !== "info") return false;
                    if (logLevelFilter === "log" && lvl !== "log") return false;
                    if (logLevelFilter === "debug" && lvl !== "debug") return false;
                  }
                  if (logSearchQuery) {
                    const q = logSearchQuery.toLowerCase();
                    const msgMatch = (log.message || "").toLowerCase().includes(q);
                    const argsMatch = (log.args || []).some((a) =>
                      (typeof a === "object" ? JSON.stringify(a) : String(a))
                        .toLowerCase()
                        .includes(q)
                    );
                    return msgMatch || argsMatch;
                  }
                  return true;
                });
              }, [logs, logLevelFilter, logSearchQuery]);

              const logCounts = useMemo(() => {
                let error = 0, warn = 0, info = 0;
                for (let i = 0; i < logs.length; i++) {
                  const lvl = (logs[i].level || "log").toLowerCase();
                  if (lvl === "error" || logs[i].isError) error++;
                  else if (lvl === "warn" || lvl === "warning") warn++;
                  else if (lvl === "info" || lvl === "log" || lvl === "debug") info++;
                }
                return { error, warn, info, total: logs.length };
              }, [logs]);

              const executeREPLExpression = () => {
                const code = (replInput || "").trim();
                if (!code || executingJS) return;

                setReplHistory((prev) => {
                  if (prev.length > 0 && prev[prev.length - 1] === code) {
                    return prev;
                  }
                  return [...prev, code];
                });
                setReplHistoryIndex(-1);
                setReplInput("");
                setExecutingJS(true);

                const evalId = `eval-${Date.now()}`;

                // In-stream rendering of the command (> code)
                setLogs((prev) => [
                  ...prev,
                  {
                    id: Date.now() + Math.random(),
                    evalId,
                    level: "eval_input",
                    isReplInput: true,
                    code,
                    message: `> ${code}`,
                    args: [`> ${code}`],
                    timestamp: new Date().toISOString(),
                  },
                ]);

                // Dedicated REPL tab outputs for parity
                setReplOutputs((prev) => [
                  ...prev,
                  {
                    id: Date.now(),
                    evalId,
                    code,
                  },
                ]);

                const sent = sendWebSocketMessage({
                  type: "exec_js",
                  code,
                  evalId,
                });

                if (!sent) {
                  setExecutingJS(false);
                }
              };

              const storageItems = useMemo(() => {
                const entries = storageData[selectedStorageType] || [];
                if (!storageSearchQuery) return entries;
                const query = storageSearchQuery.toLowerCase();
                return entries.filter(
                  (item) =>
                    item.key.toLowerCase().includes(query) ||
                    item.value.toLowerCase().includes(query),
                );
              }, [storageData, selectedStorageType, storageSearchQuery]);

              const handlePinChange = (e) => {
                setPinInputValue(e.target.value.replace(/\D/g, "").slice(0, 6));
              };

              const copyRoomLink = () => {
                const url = roomKey
                  ? `${window.location.origin}/#/room/${roomPin}?key=${encodeURIComponent(roomKey)}`
                  : `${window.location.origin}/#/room/${roomPin}`;
                navigator.clipboard.writeText(url);
                antMessage.success("Room link copied to clipboard!");
              };

              const copyText = (text, successMsg = "Copied to clipboard!") => {
                if (!text) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(text).then(() => {
                    antMessage.success(successMsg);
                  }).catch(() => {
                    antMessage.error("Failed to copy text.");
                  });
                } else {
                  const ta = document.createElement("textarea");
                  ta.value = text;
                  ta.style.position = "fixed";
                  ta.style.opacity = "0";
                  document.body.appendChild(ta);
                  ta.focus();
                  ta.select();
                  try {
                    document.execCommand("copy");
                    antMessage.success(successMsg);
                  } catch {
                    antMessage.error("Failed to copy text.");
                  }
                  document.body.removeChild(ta);
                }
              };

              const handleRefreshSystemInfo = () => {
                setRefreshingSystem(true);
                sendWebSocketMessage({ type: "pull_device_info" });
                setTimeout(() => setRefreshingSystem(false), 1500);
              };

              const formatTimestamp = (ts) => {
                try {
                  const d = new Date(ts);
                  return (
                    d.toLocaleTimeString() +
                    "." +
                    String(d.getMilliseconds()).padStart(3, "0")
                  );
                } catch {
                  return ts;
                }
              };

              // Recursive DOM Node
              const DomTreeNode = ({ node }) => {
                const [expanded, setExpanded] = useState(true);
                if (!node) return null;
                const hasChildren = node.children && node.children.length > 0;

                return (
                  <div
                    style={{
                      marginLeft: 16,
                      marginTop: 4,
                      fontFamily: "var(--font-family-mono)",
                      fontSize: 12.5,
                    }}
                  >
                    <div
                      onClick={() => setExpanded(!expanded)}
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 6,
                        cursor: hasChildren ? "pointer" : "default",
                        padding: "2px 8px",
                        borderRadius: 6,
                        background: token.colorBgLayout,
                        border: `1px solid ${token.colorBorder}`,
                      }}
                    >
                      {hasChildren && (
                        <span style={{ fontSize: 10 }}>{expanded ? "▼" : "▶"}</span>
                      )}
                      <span style={{ color: token.colorPrimary, fontWeight: 600 }}>
                        &lt;{node.tag || "node"}
                      </span>
                      {node.id && (
                        <span style={{ color: token.colorWarning }}>
                          id="{node.id}"
                        </span>
                      )}
                      {node.className && (
                        <span style={{ color: token.colorSuccess }}>
                          class="{node.className}"
                        </span>
                      )}
                      <span style={{ color: token.colorPrimary, fontWeight: 600 }}>
                        &gt;
                      </span>
                      {node.text && (
                        <span style={{ color: token.colorTextSecondary }}>
                          "{node.text.slice(0, 40)}
                          {node.text.length > 40 ? "..." : ""}"
                        </span>
                      )}
                    </div>
                    {hasChildren && expanded && (
                      <div>
                        {node.children.map((child, idx) => (
                          <DomTreeNode key={idx} node={child} />
                        ))}
                        <div
                          style={{
                            color: token.colorPrimary,
                            fontWeight: 600,
                            marginTop: 2,
                          }}
                        >
                          &lt;/{node.tag || "node"}&gt;
                        </div>
                      </div>
                    )}
                  </div>
                );
              };

              const renderHeadersTab = (req) => {
                if (!req) return null;
                const reqHeaders = Object.entries(req.headers || {});
                const resHeaders = Object.entries(req.responseHeaders || {});

                return (
                  <div style={{ padding: "8px 0" }}>
                    {/* General Section */}
                    <div style={{ marginBottom: 16 }}>
                      <Text strong style={{ fontSize: 13, color: token.colorTextSecondary, display: "block", marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.05em" }}>
                        General Information
                      </Text>
                      <div style={{ background: token.colorBgLayout, borderRadius: 8, border: `1px solid ${token.colorBorder}`, padding: "8px 12px" }}>

                                      padding: 14,
                                      borderRadius: 12,
                                      background: token.colorBgLayout,
                                      border: `1px solid ${token.colorBorder}`,
                                      fontFamily: "var(--font-family-mono)",
                                      fontSize: 13,
                                    }}
                                  >
                                    {replOutputs.length === 0 ? (
                                      <Text
                                        style={{ color: token.colorTextSecondary }}
                                      >
                                        Type a JavaScript expression below and press
                                        Enter to execute on the mobile device.
                                      </Text>
                                    ) : (
                                      replOutputs.map((out) => (
                                        <div
                                          key={out.id}
                                          style={{ marginBottom: 10 }}
                                        >
                                          {out.isInput ? (
                                            <div
                                              style={{
                                                color: token.colorPrimary,
                                                fontWeight: 600,
                                              }}
                                            >
                                              &gt; {out.code}
                                            </div>
                                          ) : (
                                            <div
                                              style={{
                                                color: out.isError
                                                  ? token.colorError
                                                  : token.colorSuccess,
                                                paddingLeft: 12,
                                                whiteSpace: "pre-wrap",
                                              }}
                                            >
                                              &lt; {out.result}
                                            </div>
                                          )}
                                        </div>
                                      ))
                                    )}
                                    <div ref={replEndRef} />
                                  </div>

                                  <div
                                    style={{
                                      display: "flex",
                                      gap: 10,
                                      marginTop: 12,
                                      flexWrap: "nowrap",
                                    }}
                                  >
                                    <Input
                                      prefix={
                                        <span
                                          style={{
                                            fontFamily: "var(--font-family-mono)",
                                            color: token.colorPrimary,
                                          }}
                                        >
                                          &gt;
                                        </span>
                                      }
                                      placeholder={
                                        isMobile
                                          ? "e.g. document.title"
                                          : "e.g. document.title, window.location.href, 2 + 2"
                                      }
                                      value={replInput}
                                      onChange={(e) => setReplInput(e.target.value)}
                                      onKeyDown={(e) => {
                                        if (e.key === "Enter") {
                                          executeREPLExpression();
                                        } else if (e.key === "ArrowUp") {
                                          if (replHistory.length > 0) {
                                            const nextIdx =
                                              replHistoryIndex < 0
                                                ? replHistory.length - 1
                                                : Math.max(0, replHistoryIndex - 1);
                                            setReplHistoryIndex(nextIdx);
                                            setReplInput(replHistory[nextIdx]);
                                          }
                                        } else if (e.key === "ArrowDown") {
                                          if (replHistoryIndex >= 0) {
                                            const nextIdx = replHistoryIndex + 1;
                                            if (nextIdx >= replHistory.length) {
                                              setReplHistoryIndex(-1);
                                              setReplInput("");
                                            } else {
                                              setReplHistoryIndex(nextIdx);
                                              setReplInput(replHistory[nextIdx]);
                                            }
                                          }
                                        }
                                      }}
                                      style={{
                                        fontFamily: "var(--font-family-mono)",
                                      }}
                                    />
                                    <Button
                                      type="primary"
                                      icon={<PlayCircleOutlined />}
                                      loading={executingJS}
                                      onClick={executeREPLExpression}
                                      aria-label="Execute"
                                      style={{ flexShrink: 0 }}
                                    >
                                      {isMobile ? null : "Execute"}
                                    </Button>
                                    <Button
                                      icon={<ClearOutlined />}
                                      onClick={() => setReplOutputs([])}
                                      aria-label="Clear output"
                                      style={{ flexShrink: 0 }}
                                    >
                                      {isMobile ? null : "Clear"}
                                    </Button>
                                  </div>
                                </div>
                              ),
                            },
                          ]}
                        />
                      </div>
                    )}
                  </Content>
                </Layout>
              );
            }

            // Root App: ThemeProvider owns the mode and wraps ConfigProvider
            function App() {
              return (
                <ThemeProvider>
                  <AntApp>
                    <Dashboard />
                  </AntApp>
                </ThemeProvider>
              );
            }

            // Mount React App
            ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
